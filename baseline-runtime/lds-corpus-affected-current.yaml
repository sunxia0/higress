version_info: "affected-numeric-comparison-limit"
resources:
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: corpus-affected-numeric-comparison-limit
    address:
      socket_address: {address: 0.0.0.0, port_value: 14009}
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: corpus-affected-numeric-comparison-limit
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "access request_id=%REQ(X-REQUEST-ID)% listener=corpus-affected-numeric-comparison-limit method=%REQ(:METHOD)% path=%REQ(:PATH)% code=%RESPONSE_CODE% flags=%RESPONSE_FLAGS%\n"
              route_config:
                name: route-corpus-affected-numeric-comparison-limit
                virtual_hosts:
                  - name: local-corpus-affected-numeric-comparison-limit
                    domains: ["*"]
                    routes:
                      - match: {prefix: "/"}
                        route: {cluster: backend-primary, timeout: 30s}
              http_filters:
                - name: envoy.filters.http.wasm
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                    config:
                      name: corpus-affected-numeric-comparison-limit
                      root_id: corpus-affected-numeric-comparison-limit
                      vm_config:
                        vm_id: corpus-affected-numeric-comparison-limit
                        runtime: envoy.wasm.runtime.v8
                        code:
                          local: {filename: /runtime/corpus-plugin-affected.wasm}
                      configuration:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"server":{"name":"runtime-schema-fixtures"}}'
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

type_url: type.googleapis.com/envoy.config.listener.v3.Listener
