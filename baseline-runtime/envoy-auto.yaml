admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9911}
static_resources:
  listeners:
  - name: proxy-auto-rejected
    address:
      socket_address: {address: 0.0.0.0, port_value: 11000}
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: proxy-auto-rejected
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "access request_id=%REQ(X-REQUEST-ID)% listener=proxy-auto-rejected method=%REQ(:METHOD)% path=%REQ(:PATH)% code=%RESPONSE_CODE% flags=%RESPONSE_FLAGS%\n"
              route_config:
                name: route-proxy-auto-rejected
                virtual_hosts:
                  - name: local-proxy-auto-rejected
                    domains: ["*"]
                    routes:
                      - match: {prefix: "/"}
                        route: {cluster: backend-primary, timeout: 30s}
              http_filters:
                - name: envoy.filters.http.wasm
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                    config:
                      name: proxy-auto-rejected
                      root_id: proxy-auto-rejected
                      vm_config:
                        vm_id: proxy-auto-rejected
                        runtime: envoy.wasm.runtime.v8
                        code:
                          local: {filename: /runtime/plugin.wasm}
                      configuration:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"server":{"mcpServerURL":"http://backend-primary:8080/legacy","name":"proxy-auto-rejected","protocolStrategy":"auto","transport":"http","type":"mcp-proxy"},"tools":[{"args":[{"description":"Value to echo","name":"value","required":true,"type":"string"}],"description":"Deterministic observable proxy tool","name":"proxy_echo"}]}'
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: backend-primary
    connect_timeout: 5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: backend-primary
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address: {address: backend-primary, port_value: 8080}
