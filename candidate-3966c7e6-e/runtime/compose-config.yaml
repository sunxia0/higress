        - CMD
        - wget
        - -q
        - -O
        - '-'
        - http://127.0.0.1:8080/healthz
      timeout: 2s
      interval: 1s
      retries: 30
    image: docker.io/library/python:3.12-alpine
    networks:
      default: null
    volumes:
