version_info: "candidate-rule-level"
resources:
  - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    name: corpus-candidate-rule-level
    address:
      socket_address: {address: 0.0.0.0, port_value: 14008}
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: corpus-candidate-rule-level
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        inline_string: "access request_id=%REQ(X-REQUEST-ID)% listener=corpus-candidate-rule-level method=%REQ(:METHOD)% path=%REQ(:PATH)% code=%RESPONSE_CODE% flags=%RESPONSE_FLAGS%\n"
              route_config:
                name: route-corpus-candidate-rule-level
                virtual_hosts:
                  - name: local-corpus-candidate-rule-level
                    domains: ["*"]
                    routes:
                      - match: {prefix: "/"}
                        route: {cluster: backend-primary, timeout: 30s}
              http_filters:
                - name: envoy.filters.http.wasm
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                    config:
                      name: corpus-candidate-rule-level
                      root_id: corpus-candidate-rule-level
                      vm_config:
                        vm_id: corpus-candidate-rule-level
                        runtime: envoy.wasm.runtime.v8
                        code:
                          local: {filename: /runtime/corpus-plugin-candidate.wasm}
                      configuration:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"_rules_":[{"_match_domain_":["mcp.runtime.test"],"server":{"name":"corpus-rule-level","type":"rest"},"tools":[{"args":[{"name":"recordId","position":"path","required":true,"type":"string"},{"name":"page","position":"query","type":"integer"},{"name":"X-Corpus-Flag","position":"header","type":"boolean"},{"name":"payload","position":"body","properties":{"amount":{"type":"integer"}},"type":"object"},{"enum":["A"],"items":{"type":"string"},"name":"problem","position":"body","type":"array"}],"description":"Representative rule-level schema fixture","name":"fixture_tool","requestTemplate":{"argsToJsonBody":true,"method":"POST","url":"http://backend-primary:8080/corpus/rule-level/{recordId}?fixed=yes"}}]}],"server":{"name":"corpus-rule-global","type":"rest"},"tools":[{"name":"global_valid","requestTemplate":{"method":"GET","url":"http://backend-primary:8080/corpus/global"}}]}'
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

type_url: type.googleapis.com/envoy.config.listener.v3.Listener
